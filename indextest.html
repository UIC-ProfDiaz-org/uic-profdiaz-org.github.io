<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Links</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 40px auto; max-width: 600px; line-height: 1.6; padding: 0 20px; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
        a { color: #0366d6; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .error { color: #cb2431; font-weight: bold; }
        .loading { color: #6a737d; font-style: italic; }
    </style>
</head>
<body>

    <h1>Student Activity Files</h1>
    <div id="status" class="loading">Loading links...</div>
    <ul id="links-list"></ul>

    <script>
        const API_URL = 'https://api.github.com/repos/uic-profdiaz-org/uic-profdiaz-org.github.io/contents/';
        // Base URL pointing to the raw file views or your preferred page layout
        const BASE_VIEW_URL = 'https://github.com';

        async function fetchStudentLinks() {
            const statusDiv = document.getElementById('status');
            const listContainer = document.getElementById('links-list');

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }

                const files = await response.json();
                
                // Filter for Markdown files only (excluding README.md if necessary)
                const mdFiles = files.filter(file => 
                    file.name.toLowerCase().endsWith('.md') && 
                    file.name.toLowerCase() !== 'readme.md'
                );

                if (mdFiles.length === 0) {
                    statusDiv.textContent = 'No student files found.';
                    return;
                }

                // Hide loading status
                statusDiv.style.display = 'none';

                // Dynamically build the list
                mdFiles.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // Link to the GitHub file view (or use file.html_url directly)
                    a.href = file.html_url; 
                    // Display clean name without the .md extension
                    a.textContent = file.name.replace(/\.md\$/i, ''); 
                    a.target = '_blank';

                    li.appendChild(a);
                    listContainer.appendChild(li);
                });

            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = `Failed to load links: ${error.message}`;
                console.error(error);
            }
        }

        fetchStudentLinks();
    </script>
</body>
</html>
